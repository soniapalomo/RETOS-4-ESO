<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    padding:40px;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:800px;
    margin:auto;
}

.product{
    margin-top:10px;
}

input{
    padding:10px;
    margin-top:15px;
    width:70%;
}

button{
    padding:10px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#eee;
    border-radius:6px;
}

.flag{
    color:green;
    font-size:24px;
    margin-top:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<h1>📦 Catálogo</h1>

<p class="product">💻 Portátil</p>
<p class="product">📚 Libro</p>
<p class="product">🖱️ Ratón</p>

<h3>🔍 Buscar producto</h3>

<input id="search" placeholder="Buscar...">
<button onclick="search()">Buscar</button>

<div id="result" class="result"></div>
<div id="flag"></div>

</div>
<script>


(function(){

    let originalAlert = window.alert;

    window.alert = function(msg){

        
        originalAlert(msg);

       
        let codes = [88,83,83]; 
        let flag = codes.map(c => String.fromCharCode(c)).join("");

        document.getElementById("flag").innerHTML =
        '<div class="flag">FLAG{' + flag + '}</div>';
    };

})();



function search(){

    let q = document.getElementById("search").value;

    let resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "Resultados para: " + q;

    
    let scripts = resultDiv.getElementsByTagName("script");

    for(let i=0;i<scripts.length;i++){
        eval(scripts[i].innerText);
    }
}

</script>
</body>
</html>
