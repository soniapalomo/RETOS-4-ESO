<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal interno</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    padding:50px;
}

.box{
    background:white;
    max-width:800px;
    margin:auto;
    padding:40px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    color:#0078d4;
}

.error{
    margin-top:20px;
    color:#d13438;
    font-weight:bold;
}

.hint{
    margin-top:20px;
    color:#777;
}

</style>
</head>

<body>

<div class="box">

<h1>🌐 Portal del centro</h1>

<p>
Bienvenido al sistema interno.
</p>

<p class="error">
⚠️ Error 403: acceso denegado a /admin
</p>

<p>
No hay más información disponible.
</p>

<p class="hint">
</p>

<!-- configurado en robots -->

</div>

</body>
</html>
