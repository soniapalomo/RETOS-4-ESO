<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel TIC Instituto</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
}

.container{
    width:400px;
    margin:auto;
    margin-top:50px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

button{
    margin-top:25px;
    background:#0078d4;
    padding:14px 24px;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-weight: bold;
}

button:hover{
    background:#005a9e;
}

.flag{
    margin-top:30px;
    background:black;
    padding:20px;
    border-radius:8px;
    color:#00ff88;
    font-size:24px;
    font-family: monospace;
}

.status{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 Panel interno</h1>

<p>Acceso restringido. Solo administradores.</p>

<p id="status" class="status"></p>

<button type="button" onclick="checkAccess()">
Comprobar acceso
</button>

<div id="flag"></div>

</div>

<script>
// ✅ Inicializar datos si no existen
if(!localStorage.getItem("role")){
    localStorage.setItem("role","guest");
}

if(!localStorage.getItem("auth")){
    localStorage.setItem("auth","false");
}

// ✅ Comprobar acceso (Método Base64 100% compatible en local)
function checkAccess(){
    
    // .trim() limpia espacios; .toLowerCase() pasa a minúsculas
    let roleValue = (localStorage.getItem("role") || "").trim().toLowerCase();
    let authValue = (localStorage.getItem("auth") || "").trim().toLowerCase();


    let base64Role = btoa(roleValue);
    let base64Auth = btoa(authValue);


    if(base64Role === "YWRtaW4=" && base64Auth === "dHJ1ZQ=="){

        document.getElementById("status").innerHTML = "✅ Acceso concedido como administrador";
        document.getElementById("status").style.color = "green";


        let m = [70,76,65,71,123,76,79,67,65,76,95,83,84,79,82,65,71,69,125];
        let f = "";
        for(let i=0; i<m.length; i++) { f += String.fromCharCode(m[i]); }

        document.getElementById("flag").innerHTML = `<div class="flag">${f}</div>`;

    }else{
        document.getElementById("status").innerHTML = `❌ Acceso denegado.`;
        document.getElementById("status").style.color = "red";
        document.getElementById("flag").innerHTML = "";
    }
}
</script>

</body>
</html>
